# A tag like v0.3.5 makes a GitHub release with the wheel and the source archive attached, so
#   pip install git+https://github.com/0x1audio/0x1audio-sdk-py@v0.3.5
# and an install from the wheel work before (and after) the package is on PyPI. They are the
# same files sdk-publish.yml uploads. No registry is touched here.
#
# Actions are pinned by commit SHA (the tag is in the comment).
name: Release files

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: The tag is the version in pyproject.toml
        run: |
          have="v$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$have" != "$GITHUB_REF_NAME" ]; then echo "::error::pyproject.toml says $have, the tag is $GITHUB_REF_NAME."; exit 1; fi

      - name: Test
        run: |
          uv run --with numpy python -m unittest discover tests
          uv run python contract/generate.py --check

      # Reproducible: the wheel's timestamps are the commit's, as in sdk-publish.yml.
      - name: Build
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          uv build --out-dir dist
          uv run --no-project --isolated --with dist/*.whl sh scripts/stranger.sh

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --title "ox1audio ${GITHUB_REF_NAME#v}" --notes "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)." --verify-tag

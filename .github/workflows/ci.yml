# Every push and pull request: the tests, the contract and the package as a stranger gets it.
# Actions are pinned by commit SHA (the tag is in the comment).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Test
        run: |
          uv run --python ${{ matrix.python }} --with numpy python -m unittest discover tests
          uv run --python ${{ matrix.python }} python contract/generate.py --check
          uv run --python ${{ matrix.python }} --extra generate python scripts/openapi.py --check
      - name: The wheel installs and runs with nothing else around
        run: |
          uv build --out-dir dist
          uvx --python ${{ matrix.python }} twine check dist/*
          uv run --no-project --isolated --python ${{ matrix.python }} --with dist/*.whl sh scripts/stranger.sh

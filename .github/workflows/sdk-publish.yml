# Publishes ox1audio to PyPI with trusted publishing (GAB-40): no API token is stored
# anywhere. GitHub proves to PyPI which repo, workflow and environment is asking,
# through a short-lived OIDC token.
#
# By hand only (Actions › Publish the SDK › Run workflow). Type the version from
# pyproject.toml to confirm; it must match, and it must not be on PyPI already.
#
# One-time setup, done by the founder (RELEASE.md, "Publishing the SDKs"):
#   1. pypi.org › Your projects › ox1audio › Publishing › Add a trusted publisher
#      (or, before the first upload, Account › Publishing › Add a pending publisher):
#      owner 0x1audio, repository 0x1audio-sdk-py, workflow sdk-publish.yml,
#      environment pypi.
#   2. Here: Settings › Environments › New environment "pypi", with yourself as a
#      required reviewer, so every upload waits for a person.
#
# Actions are pinned by commit SHA (the tag is in the comment).
name: Publish the SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version in pyproject.toml, typed again to confirm"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: The version matches and is new
        env:
          WANT: ${{ inputs.version }}
        run: |
          have=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$have" != "$WANT" ]; then echo "::error::pyproject.toml says $have, not $WANT."; exit 1; fi
          if curl -sf "https://pypi.org/pypi/ox1audio/$have/json" > /dev/null; then echo "::error::ox1audio $have is already on PyPI."; exit 1; fi

      - name: Test
        run: |
          uv run python -m unittest discover tests
          uv run python contract/generate.py --check
          uv run --extra generate python scripts/openapi.py --check

      # Reproducible: the wheel's timestamps are the commit's, as in the desktop's pin (scripts/sdk-pin.mjs).
      - name: Build
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          uv build --out-dir dist
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ox1audio/${{ inputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

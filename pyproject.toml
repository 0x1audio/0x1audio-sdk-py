[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ox1audio"
version = "0.3.5"
description = "Build Mixel apps: the Python SDK and the mixel command."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "0x1audio" }]
keywords = ["mixel", "0x1audio", "audio", "music", "samples", "sdk", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = ["attrs>=24", "httpx>=0.27", "imageio-ffmpeg>=0.5", "python-dateutil>=2.8"]

[project.optional-dependencies]
generate = ["openapi-python-client==0.28.3", "pyyaml>=6", "ruff>=0.8"]

[project.urls]
Homepage = "https://0x1audio.com"
Documentation = "https://docs.0x1audio.com"
Repository = "https://github.com/0x1audio/0x1audio-sdk-py"
Issues = "https://github.com/0x1audio/0x1audio-sdk-py/issues"
Changelog = "https://github.com/0x1audio/0x1audio-sdk-py/blob/main/CHANGELOG.md"

[project.scripts]
mixel = "ox1audio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ox1audio = ["py.typed", "AGENTS.md", "app.schema.json", "docs/*.md", "docs/llms.txt", "docs/ui.json", "templates/*"]
"ox1audio.cloud" = ["py.typed"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ox1audio"
version = "0.3.2"
description = "Build Mixel apps: the Python SDK and the mixel command."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["attrs>=24", "httpx>=0.27", "imageio-ffmpeg>=0.5"]

[project.optional-dependencies]
generate = ["openapi-python-client==0.28.3", "ruff>=0.8"]

[project.scripts]
mixel = "ox1audio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ox1audio = ["py.typed", "AGENTS.md", "app.schema.json", "docs/*.md", "docs/llms.txt", "docs/ui.json", "templates/*"]
"ox1audio.cloud" = ["py.typed"]

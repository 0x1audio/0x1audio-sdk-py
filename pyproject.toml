[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ox1audio"
version = "0.3.0"
description = "Python SDK for the 0x1audio cloud and local app workers."
requires-python = ">=3.11"
dependencies = ["attrs>=24", "httpx>=0.27", "imageio-ffmpeg>=0.5"]

[project.optional-dependencies]
generate = ["openapi-python-client==0.28.3", "ruff>=0.8"]

[project.scripts]
mixel = "ox1audio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ox1audio = ["py.typed", "AGENTS.md"]
"ox1audio.cloud" = ["py.typed"]
